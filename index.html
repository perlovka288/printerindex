<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Админ-панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1220;--card:#1a1f33;--ink:#eef0fa;--mut:#8b92b0;--acc:#6c8cff;--ok:#3ddc97;--bad:#ff6b7a;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#232a4d,var(--bg));color:var(--ink);font:15px/1.4 system-ui,sans-serif;min-height:100vh;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);transition:.3s}.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
button,.chip{font:inherit;color:var(--ink);background:#262d4a;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s}
button:active{transform:scale(.96)}.on{background:var(--acc)!important;color:#fff}
.go{background:linear-gradient(90deg,#4f74ff,#8a5cff);width:100%;font-weight:600;padding:14px}.bad{background:#3a2430;color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}.row>*{flex:1 1 auto;text-align:center}
label{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=text]{width:100%;background:#262d4a;border:0;border-radius:12px;padding:11px;color:var(--ink);font:inherit}
/* принтер */
.pr{position:relative;height:220px;display:flex;justify-content:center;overflow:hidden}
.body{position:absolute;top:10px;width:250px;height:96px;border-radius:22px;background:linear-gradient(#3a4268,#272d4b);z-index:3;box-shadow:0 10px 24px #0006}
.body:before{content:"";position:absolute;left:24px;right:24px;bottom:22px;height:8px;border-radius:6px;background:#0a0c16}
.led{position:absolute;right:20px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--mut)}
.busy .led{background:var(--acc);animation:bl .6s infinite alternate}.done .led{background:var(--ok)}.err .led{background:var(--bad)}
@keyframes bl{to{opacity:.2}}
.out{position:absolute;top:96px;width:200px;height:120px;overflow:hidden;z-index:2}
.sheet{width:200px;height:260px;background:#fff center/cover;border-radius:3px;box-shadow:0 4px 14px #0008;transform:translateY(-250px);transition:transform 1.2s cubic-bezier(.3,.7,.2,1)}
.sheet.bl{background-color:#e8eaf3}.busy .body{animation:vib .18s infinite}
@keyframes vib{50%{transform:translateY(1px)}}
.bar{height:6px;border-radius:6px;background:#262d4a;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#a07bff);transition:width 1s linear}
.big{text-align:center;font-weight:600}.sub{text-align:center;color:var(--mut);font-size:13px}
/* очередь */
.q{display:flex;gap:12px;align-items:center}.num{font-size:22px;font-weight:700;color:var(--acc);min-width:34px}
.th{width:56px;height:56px;border-radius:12px;background:#262d4a center/cover;flex:none}.q .t{flex:1;min-width:0}.q b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetw{animation:up .35s both}.pv{width:120px;height:170px;margin:0 auto 10px;border-radius:4px;background:#262d4a center/cover;box-shadow:0 6px 18px #0008}
.hide{display:none}.mut{color:var(--mut);font-size:13px}.ca{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.empty{text-align:center;color:var(--mut);padding:18px}.empty span{font-size:34px;display:block;animation:fl 2.4s infinite ease-in-out}@keyframes fl{50%{transform:translateY(-6px)}}
</style></head><body>
<h1>🖨 Админ-панель <span id="dot" class="dot"></span></h1>
<div class="card" id="pcard"><div class="pr" id="pr"><div class="body"><i class="led"></i></div><div class="out"><div class="sheet bl" id="sheet"></div></div></div>
<div class="big" id="pt">Ожидает заказов</div><div class="bar"><i id="pb"></i></div><div class="sub" id="ps"></div></div>
<div class="tabs"><button data-t="q" class="on">Очередь</button><button data-t="s">Настройки</button><button data-t="c">Соадмины</button></div>

<div id="tq"><div id="ql"></div><div class="card sheetw hide" id="ord">
<div class="pv" id="opv"></div><div class="big" id="oti"></div><div class="sub" id="ofn"></div>
<div id="ctl"></div><button class="go" id="pgo">🖨 Отправить на печать</button><div class="row"><button class="bad" id="prj">❌ Отклонить</button><button id="pcl">Закрыть</button></div></div>
<div id="hl"></div></div>
<div id="ts" class="hide"><div class="card"><div id="dctl"></div><div class="mut">Это настройки по умолчанию. Сохраняются при печати.</div></div></div>
<div id="tc" class="hide"><div class="card"><b>Соадмины</b><div class="mut" style="margin:4px 0 10px">Их заказы печатаются сразу, без твоего одобрения. Введи Telegram ID (узнать: бот @userinfobot).</div>
<div id="cl"></div><input type="text" id="cid" inputmode="numeric" placeholder="Telegram ID, например 123456789"><button class="go" id="cadd" style="margin-top:10px">Добавить соадмина</button></div></div>

<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}}
const $=i=>document.getElementById(i),qs=new URLSearchParams(location.search);
let TK=qs.get("tk")||(/tk=([^&]+)/.exec(location.hash)||[])[1]||localStorage.getItem("tk")||"";const AD=qs.get("a");
try{if(TK)localStorage.setItem("tk",TK);if(qs.get("tk"))history.replaceState(null,"",location.pathname)}catch(e){}
const api="https://api.telegram.org/bot"+TK,QL={low:"Минимальное",medium:"Среднее",high:"Высокое"};
const PAPERS={a4:"A4",a5:"A5",b5:"B5",letter:"Letter","10x15":"10×15","13x18":"13×18"},MEDIA={plain:"Обычная",matte:"Матовая",glossy:"Глянцевая",semi:"Полуглянец",driver:"Как в драйвере"};
let S=null,cur=null,dr=null,tab="q";const img={};
async function pic(fid){if(!fid||!TK)return"";if(img[fid]!==undefined)return img[fid];img[fid]="";
 try{const r=await(await fetch(api+"/getFile?file_id="+encodeURIComponent(fid))).json();img[fid]="https://api.telegram.org/file/bot"+TK+"/"+r.result.file_path}catch(e){}return img[fid]}
function seg(id,opts,val,on){return'<div class="row" id="'+id+'">'+Object.entries(opts).map(([k,v])=>'<button data-k="'+k+'" class="'+(k==val?"on":"")+'">'+v+'</button>').join("")+'</div>'}
function controls(d,pre){return'<label>Качество</label>'+seg(pre+"q",QL,d.q)+'<label>Режим листа</label>'+seg(pre+"s",{1:"Целиком",0:"На весь лист"},d.s?1:0)+
'<label>Размер бумаги</label>'+seg(pre+"p",PAPERS,d.p)+'<label>Тип бумаги</label>'+seg(pre+"m",MEDIA,d.m)+
'<label>Яркость: <b id="'+pre+'bv">'+d.b+'%</b></label><input type="range" min="0" max="100" value="'+d.b+'" id="'+pre+'b">'+
'<label>Копий</label><div class="row"><button id="'+pre+'-">−</button><button id="'+pre+'n" style="flex:2">'+d.c+'</button><button id="'+pre+'+">+</button></div>'}
function bind(d,pre,after){const g=i=>$(pre+i);
 [["q",v=>d.q=v],["s",v=>d.s=v==="1"],["p",v=>d.p=v],["m",v=>d.m=v]].forEach(([k,f])=>g(k).onclick=e=>{const b=e.target.closest("button");if(!b)return;f(b.dataset.k);[...g(k).children].forEach(c=>c.classList.toggle("on",c===b));tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged();after&&after()});
 g("b").oninput=e=>{d.b=+e.target.value;g("bv").textContent=d.b+"%";after&&after()};
 g("-").onclick=()=>{d.c=Math.max(1,d.c-1);g("n").textContent=d.c};g("+").onclick=()=>{d.c=Math.min(99,d.c+1);g("n").textContent=d.c}}
function filt(b){return"brightness("+(1+b/160).toFixed(2)+") contrast("+(1-b/700).toFixed(2)+")"}
function send(o){if(tg)tg.sendData(JSON.stringify(o));else alert(JSON.stringify(o))}
function renderQ(){const q=S.q;$("ql").innerHTML=q.length?q.map((o,i)=>'<div class="card q" data-o="'+o.o+'" style="animation-delay:'+i*70+'ms"><div class="num">'+(i+1)+'</div><div class="th" data-f="'+(o.f[0]||"")+'"></div><div class="t"><b>'+(o.t||"Заказ")+'</b><span class="mut">#'+o.o+' · файлов: '+o.n+'</span></div><span>›</span></div>').join(""):'<div class="card empty"><span>🕊</span>Очередь пуста</div>';
 document.querySelectorAll(".th").forEach(async e=>{const u=await pic(e.dataset.f);if(u)e.style.backgroundImage="url("+u+")"});
 document.querySelectorAll(".q").forEach(e=>e.onclick=()=>openOrd(e.dataset.o));
 $("hl").innerHTML=S.h.length?'<div class="mut" style="margin:8px 4px">Недавно</div>'+S.h.map(h=>'<div class="mut" style="padding:3px 4px">'+(h.ok?"✅":"⚠️")+" #"+h.o+" · "+h.t+"</div>").join(""):""}
async function openOrd(id){const o=S.q.find(x=>x.o===id);if(!o){cur=null;$("ord").classList.add("hide");return}
 if(!cur||cur.o!==id){cur=o;dr={...S.d,c:1}}
 $("ord").classList.remove("hide");$("oti").textContent=o.t||"Заказ";$("ofn").textContent="#"+o.o+" · файлов: "+o.n;
 $("ctl").innerHTML=controls(dr,"o");bind(dr,"o",()=>{$("opv").style.filter=filt(dr.b)});
 const u=await pic(o.f[0]);$("opv").style.backgroundImage=u?"url("+u+")":"";$("opv").style.filter=filt(dr.b);$("ord").scrollIntoView({behavior:"smooth"})}
$("pgo").onclick=()=>{if(cur)send({a:"print",o:cur.o,q:dr.q,s:dr.s,c:dr.c,b:dr.b,p:dr.p,m:dr.m})};
$("prj").onclick=()=>{if(cur)send({a:"reject",o:cur.o})};$("pcl").onclick=()=>{cur=null;$("ord").classList.add("hide")};
let dd=null;function renderS(){if(dd)return;dd={...S.d,c:1};$("dctl").innerHTML=controls(dd,"d").replace(/<label>Копий[\s\S]*$/,"");bind(dd,"d")}
function renderC(){if(!$("cl"))return;$("cl").innerHTML=S.ca.length?S.ca.map(i=>'<div class="ca"><span>👤 '+i+'</span><button class="bad" data-i="'+i+'">Убрать</button></div>').join(""):'<div class="mut" style="padding:6px 0">Пока никого</div>';
 $("cl").querySelectorAll("button").forEach(b=>b.onclick=()=>send({a:"coadmin",op:"del",id:+b.dataset.i}))}
$("cadd").onclick=()=>{const v=+$("cid").value.trim();if(v>0)send({a:"coadmin",op:"add",id:v})};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));["q","s","c"].forEach(t=>$("t"+t)&&$("t"+t).classList.toggle("hide",t!==tab))});
if(qs.get("r")==="co"){document.querySelector("[data-t=c]").remove();$("tc").remove()}
/* принтер: анимация */
const EST=30;let lastFid="";
async function tick(){const n=S&&S.now,pr=$("pr"),sh=$("sheet");pr.className="pr";let p=0,t="Ожидает заказов",s="",y=-250;
 if(n){const P=Math.max(1,n.P||1);
  if(n.st==="dl"){t="Скачиваю файлы…";pr.classList.add("busy")}
  else if(n.st==="wait"||n.st==="print"){pr.classList.add("busy");const el=n.t0?Math.max(0,Date.now()/1e3-n.t0):0,pg=Math.min(P,Math.floor(el/EST)+1),fr=Math.min(.96,(el%EST)/EST);p=Math.min(.97,((pg-1)+fr)/P);y=-250+fr*250;t="Печатаю заказ #"+n.o;s="Страница "+pg+" из "+P+" · "+(n.t||"")}
  else if(n.st==="done"){pr.classList.add("done");p=1;y=-20;t="✅ Готово! Заказ #"+n.o}
  else{pr.classList.add("err");t="⚠️ Ошибка печати"}
  if(n.f&&n.f!==lastFid){lastFid=n.f;const u=await pic(n.f);sh.classList.toggle("bl",!u);sh.style.backgroundImage=u?"url("+u+")":""}
 }else lastFid="";
 sh.style.transform="translateY("+y+"px)";$("pb").style.width=p*100+"%";$("pt").textContent=t;$("ps").textContent=s;$("dot").classList.toggle("on",!!S)}
async function poll(){try{const r=await(await fetch(api+"/getChat?chat_id="+AD)).json();const m=r.result&&r.result.pinned_message;
 if(m){S=JSON.parse(m.text.split("\n")[1]);renderQ();renderC();renderS();if(cur)$("ord").classList.contains("hide")||0}}catch(e){}tick()}
if(!TK||!AD)$("pt").textContent="Открой приложение кнопкой «🖨 Админ-панель» в чате с ботом";
poll();setInterval(poll,2500);setInterval(()=>S&&tick(),1000);
</script></body></html>
