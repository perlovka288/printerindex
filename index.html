<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Панель принтера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0a0b;--s1:#111113;--s2:#18181b;--s3:#212125;--line:#2a2a2f;--line2:#3a3a41;
  --tx:#ececee;--mut:#8f8f98;--dim:#5e5e66;
  --ok:#58cf98;--bad:#ef6471;--warn:#e3b04e;
  --r:16px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hide{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* каркас */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.ttl{font-size:21px;font-weight:650;letter-spacing:-.01em}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.conn.on i{background:var(--ok)}
main{padding:2px 14px calc(92px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,10,11,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--mut);border-radius:12px;transition:color .15s}
.tabs button.on{color:var(--tx)}
.tabs button .ic{width:23px;height:23px}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.sec{margin:20px 4px 8px}
.mut{color:var(--mut);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;background:var(--tx);color:var(--bg);font-weight:600;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.sec2{background:var(--s3);color:var(--tx)}
.btn.danger{background:rgba(239,100,113,.12);color:var(--bad)}
.btn[disabled]{opacity:.45}
.link{display:inline-flex;align-items:center;gap:7px;padding:8px 0;color:var(--mut);font-size:13.5px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--s3);font-size:12px;color:var(--mut);white-space:nowrap}
.chip.ok{background:rgba(88,207,152,.13);color:var(--ok)}.chip.stop{background:rgba(227,176,78,.13);color:var(--warn)}.chip.err{background:rgba(239,100,113,.13);color:var(--bad)}

/* принтер */
.pc{padding:18px 16px 16px}
.pc-head{display:flex;align-items:center;gap:8px}
.led{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.pc[data-led=busy] .led{background:var(--tx);animation:pulse 1.1s infinite alternate}
.pc[data-led=ok] .led{background:var(--ok)}.pc[data-led=err] .led{background:var(--bad)}
@keyframes pulse{to{opacity:.25}}
.pc-title{font-size:19px;font-weight:620;margin:6px 0 0;letter-spacing:-.01em}
.printer{position:relative;width:236px;height:268px;margin:12px auto 0}
.p-body{position:absolute;left:0;right:0;top:14px;height:96px;border-radius:24px;background:linear-gradient(#2d2d32,#1c1c20);border:1px solid var(--line2);box-shadow:0 16px 28px -14px #000;z-index:3}
.pc[data-led=busy] .p-body{animation:vib .22s infinite}
@keyframes vib{50%{transform:translateY(1px)}}
.p-body:before{content:"";position:absolute;left:30px;right:30px;bottom:16px;height:9px;border-radius:6px;background:#060607;box-shadow:inset 0 2px 4px #000}
.p-led{position:absolute;right:22px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pc[data-led=busy] .p-led{background:var(--tx)}.pc[data-led=ok] .p-led{background:var(--ok)}.pc[data-led=err] .p-led{background:var(--bad)}
.p-tray{position:absolute;left:50%;top:0;width:126px;height:26px;margin-left:-63px;border-radius:8px 8px 0 0;background:var(--s3);border:1px solid var(--line2);border-bottom:0;z-index:1}
.p-out{position:absolute;left:50%;top:108px;width:150px;height:158px;margin-left:-75px;overflow:hidden;z-index:2}
.sheet{position:absolute;left:50%;top:0;width:106px;height:150px;margin-left:-53px;border-radius:2px;background:#e9e9e6;box-shadow:0 8px 18px -6px #000;overflow:hidden;
  --r:0;transform:translateY(calc((var(--r) - 1) * 100%));transition:transform 1s linear,opacity .25s;opacity:0}
.sheet.show{opacity:1}.sheet.reset{transition:none}
.sheet.fall{transition:transform .28s ease-in,opacity .28s;transform:translateY(26px);opacity:0}
.sheet .ph{position:absolute;top:0;left:0;right:0;bottom:0;background:#c9c9c6 center/cover no-repeat;opacity:0;transition:opacity .35s}.sheet .ph.ld{opacity:1}
.sheet .ph-ic{position:absolute;inset:0;display:grid;place-items:center;color:#8a8a86}.sheet .ph-ic .ic{width:28px;height:28px}
.sheet .ph.ld~.ph-ic{display:none}
.okb{position:absolute;left:50%;top:150px;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:var(--ok);color:#06150d;display:grid;place-items:center;z-index:5;transform:scale(0);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.okb .ic{width:30px;height:30px;stroke-width:2.4}
.pc[data-led=ok] .okb{transform:scale(1)}
.cnt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:4px;font-variant-numeric:tabular-nums}
.cnt b{font-size:34px;font-weight:650;letter-spacing:-.02em}.cnt span{font-size:20px;color:var(--mut)}.cnt .pct{margin-left:10px;font-size:15px}
.bar{height:5px;border-radius:5px;background:var(--s3);overflow:hidden;margin:10px 2px 8px}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:var(--tx);transition:width .9s linear}
.pc[data-led=ok] .bar i{background:var(--ok)}
.pc-sub{text-align:center;color:var(--mut);font-size:13px;min-height:19px}
#stop{margin-top:14px;min-height:46px}

/* списки */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:8px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.row:active{background:var(--s2)}
.row .rt{flex:1;min-width:0}.row .rt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .rt span{color:var(--mut);font-size:13px}
.row>.ic{color:var(--dim)}
.th{position:relative;width:52px;height:52px;border-radius:11px;background:var(--s3) center/cover no-repeat;flex:none;overflow:hidden}
.th:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.th.er{opacity:.5}.th .ic{position:absolute;inset:0;margin:auto;color:var(--dim)}
.empty{display:grid;place-items:center;gap:8px;padding:34px 10px;color:var(--mut);text-align:center}
.empty .ic{width:30px;height:30px;color:var(--dim)}
.av{width:42px;height:42px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:650;font-size:16px;flex:none;border:1px solid var(--line2)}
.person{margin-bottom:8px;border-radius:14px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.person>.row{margin:0;border:0;border-radius:0;background:none}
.person .chev{transition:transform .2s}.person.open .chev{transform:rotate(180deg)}
.pbody{display:none;padding:2px 12px 12px;border-top:1px solid var(--line)}.person.open .pbody{display:block}
.ob{padding:12px 0 4px;border-bottom:1px solid var(--line)}.ob:last-child{border-bottom:0}
.oh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}.od{font-weight:600;font-size:14px}
.meta{color:var(--mut);font-size:12.5px;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid .th{width:auto;height:auto;aspect-ratio:1;border-radius:9px}

/* настройки */
.grp{padding:14px 0;border-bottom:1px solid var(--line)}.grp:last-child{border-bottom:0}
.grp h3{margin:0 0 9px;font-size:13px;font-weight:600;color:var(--mut)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:3px;background:var(--s2);border-radius:12px;border:1px solid var(--line)}
.seg button{padding:10px 4px;text-align:center;border-radius:9px;font-size:13.5px;color:var(--mut);transition:background .15s,color .15s}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:9px 13px;border-radius:11px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;color:var(--mut)}
.chips button.on{background:var(--s3);color:var(--tx);border-color:var(--line2)}
.rng{display:flex;align-items:center;gap:12px}.rng input{flex:1;accent-color:#fff}.rng output{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.stp{display:inline-flex;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:12px}
.stp button{width:46px;height:42px;display:grid;place-items:center;border-radius:12px}.stp button[disabled]{opacity:.3}
.stp output{min-width:40px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.inp{width:100%;min-height:46px;padding:0 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--tx);font:inherit}

/* окна */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ov-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:linear-gradient(var(--bg) 75%,transparent)}
.ov-top .ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--s2)}
.ov-top .tt{flex:1;min-width:0}.ov-top .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ov-top .tt span{color:var(--mut);font-size:12.5px}
.ov-body{padding:4px 14px calc(120px + env(safe-area-inset-bottom,0px))}
.paper{margin:4px auto 10px;position:relative;border-radius:3px;background:#efefec;box-shadow:0 12px 30px -10px #000;overflow:hidden;transition:width .3s,height .3s}
.paper .im{position:absolute;top:0;left:0;right:0;bottom:0;background:center/contain no-repeat;transition:filter .2s}
.paper .nofile{position:absolute;inset:0;display:grid;place-items:center;color:#8a8a86;text-align:center;font-size:13px;padding:10px}
.strip{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip .th{width:54px;height:54px;opacity:.55;border:2px solid transparent}.strip .th.sel{opacity:1;border-color:var(--tx)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(10,10,11,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.actions .btn{flex:1}.actions .btn.danger{flex:0 0 auto;width:auto;padding:0 18px}
.bub{max-width:88%;margin:0 0 8px;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--s2);border:1px solid var(--line)}
.bub small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
#viewer{background:#000;display:flex;flex-direction:column}
#viewer .vimg{flex:1;background:center/contain no-repeat;margin:0}
#viewer .vbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;color:#fff}
#viewer .vnav{display:flex;justify-content:space-between;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#viewer .ib{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.1)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;padding:12px 14px;border-radius:12px;background:var(--s3);border:1px solid var(--line2);box-shadow:0 10px 30px #000a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/></symbol>

<header class="top"><div class="ttl" id="ttl">Принтер</div><div class="conn" id="conn"><i></i><span>нет связи</span></div></header>

<main>
  <section id="v-printer">
    <div class="card pc" id="pc" data-led="idle">
      <div class="pc-head"><i class="led"></i><span class="lab" id="pc-lab">Свободен</span></div>
      <div class="pc-title" id="pc-title">Принтер свободен</div>
      <div class="printer" id="printer">
        <div class="p-tray"></div>
        <div class="p-out"><div class="sheet" id="sheet"><div class="ph" id="sheet-ph"></div><div class="ph-ic"><svg class="ic"><use href="#i-image"/></svg></div></div></div>
        <div class="p-body"><span class="p-led"></span></div>
        <div class="okb"><svg class="ic"><use href="#i-check"/></svg></div>
      </div>
      <div class="cnt" id="cnt"><b id="cnt-k">0</b><span>/</span><span id="cnt-p">0</span><span class="pct" id="cnt-pct"></span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="pc-sub" id="pc-sub"></div>
      <button class="btn danger hide" id="stop" data-act="stop"><svg class="ic"><use href="#i-stop"/></svg>Остановить печать</button>
    </div>
    <div class="sec lab" id="q-lab">Очередь</div>
    <div id="queue"></div>
  </section>
  <section id="v-history" class="hide"></section>
  <section id="v-settings" class="hide"></section>
  <section id="v-access" class="hide"></section>
</main>

<nav class="tabs" id="tabs"></nav>
<div class="ov hide" id="order"></div>
<div class="ov hide" id="log"></div>
<div class="ov hide" id="viewer"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0a0a0b"); tg.setBackgroundColor && tg.setBackgroundColor("#0a0a0b"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } } catch (e) {}
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const qs = new URLSearchParams(location.search);

/* ---------- токен (нужен только чтобы читать состояние и показывать фото) ---------- */
const TOKEN_RE = /^\d{6,}:[\w-]{30,}$/;
function readToken() {
  let t = qs.get("tk") || "";
  if (!t) { const m = /(?:^#|&)tk=([^&]+)/.exec(location.hash || ""); if (m) { try { t = decodeURIComponent(m[1]); } catch (e) {} } }
  if (!TOKEN_RE.test(t)) { try { t = localStorage.getItem("tk") || ""; } catch (e) { t = ""; } }
  return TOKEN_RE.test(t) ? t : "";
}
const TK = readToken();
try { if (TK) localStorage.setItem("tk", TK); if (qs.get("tk")) { qs.delete("tk"); history.replaceState(null, "", location.pathname + (qs.toString() ? "?" + qs : "")); } } catch (e) {}
const VIEWER = qs.get("a") || "";
const ADMIN = qs.get("r") !== "co";
const API = "https://api.telegram.org/bot" + TK;

/* ---------- словари (ключи как в bot.py) ---------- */
const QL = { low: "Минимальное", medium: "Среднее", high: "Высокое" };
const PAPERS = { a4: ["A4", 210, 297], a5: ["A5", 148, 210], b5: ["B5", 176, 250], letter: ["Letter", 216, 279], "10x15": ["10×15 см", 100, 150], "13x18": ["13×18 см", 130, 180] };
const MEDIA = { driver: "Как в драйвере", plain: "Обычная", matte: "Матовая", glossy: "Глянцевая", semi: "Полуглянец" };
const MODES = { 1: "Целиком", 0: "На весь лист" };
const RES = { ok: ["Напечатано", "ok"], stop: ["Остановлено", "stop"], err: ["Ошибка", "err"] };
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IC = (n, cls) => '<svg class="ic' + (cls ? " " + cls : "") + '"><use href="#i-' + n + '"/></svg>';
const plural = (n, f) => n + " " + (n % 10 === 1 && n % 100 !== 11 ? f[0] : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? f[1] : f[2]);
const files = (n) => plural(n, ["файл", "файла", "файлов"]);
const photos = (n) => plural(n, ["фото", "фото", "фото"]);
function fmtTs(ts) { const d = new Date(ts * 1000), p = (x) => String(x).padStart(2, "0"); return d.getDate() + " " + MON[d.getMonth()] + ", " + p(d.getHours()) + ":" + p(d.getMinutes()); }
function fmtDay(ts) { const d = new Date(ts * 1000); return d.getDate() + " " + MON[d.getMonth()]; }

/* ---------- прогресс: чистая функция, один в один с логикой бота ---------- */
/* n - состояние печати из бота; recvAt - когда оно получено; el у бота = секунд с начала печати на момент публикации */
const mono = { o: "", v: 0 };
function calcProg(n, recvAt, nowMs) {
  const P = n.P || 0, d = Math.min(P, n.d || 0);

  renderQueue(); renderHistory(); if (!docOnly) { renderSettings(); renderAccess(); }
  const open = OR.id && pendingDoc(OR.id);
  if (open && docOnly) { const changed = JSON.stringify([OR.files.length, OR.log]) !== JSON.stringify([open.fs.length, open.log || []]); if (changed) { OR.files = open.fs; OR.log = open.log || []; renderOrderBody(); } }
}
function renderConn() {
  const c = $("conn"); c.classList.toggle("on", online); c.lastChild.textContent = online ? "на связи" : "нет связи";
}

/* ---------- заказ: превью, настройки, печать, «глазами клиента» ---------- */
const OR = { id: "", files: [], sel: 0, dr: null, sending: false, log: [] };
function openOrder(id, keep) {
  const q = S && S.q.find((x) => x.o === id); if (!q) return;
  const d = pendingDoc(id);
  if (!keep || !OR.dr) OR.dr = { ...S.d, c: 1 };
  OR.id = id; OR.files = d ? d.fs : []; OR.log = d ? d.log || [] : []; if (!keep) OR.sel = 0; OR.sending = false;
  const el = $("order"); el.classList.remove("hide"); document.body.style.overflow = "hidden";
  el.innerHTML = '<div class="ov-top"><button class="ib" data-act="closeOrder" aria-label="Назад">' + IC("left") + '</button><div class="tt"><b>' + esc(q.t || "Заказ") + "</b><span>#" + esc(id) + " · " + files(q.n) + '</span></div></div>' +
    '<div class="ov-body"><div class="paper" id="paper"><div class="im" id="p-im"></div><div class="nofile" id="p-no"></div></div>' +
    '<div class="strip" id="strip"></div><div class="mut" id="p-cnt" style="text-align:center;margin-bottom:6px"></div>' +
    '<div class="card" id="ctl"></div>' + (ADMIN ? '<div class="sec lab">Что видит клиент</div><div id="clog"></div>' : "") + "</div>" +
    (q.w ? '<div class="actions"><div class="mut" style="flex:1;text-align:center;padding:14px 0">Заказ ждёт своей очереди на принтер</div></div>'
          : '<div class="actions"><button class="btn danger" data-act="reject">' + IC("x") + "Отклонить</button><button class=\"btn\" data-act=\"print\">" + IC("printer") + "Печать</button></div>");
  renderOrderBody();
  if (tg && tg.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(closeOrder); } catch (e) {} }
}
function closeOrder() {
  OR.id = ""; OR.dr = null; OR.files = []; $("order").classList.add("hide"); $("order").innerHTML = ""; document.body.style.overflow = "";
  if (tg && tg.BackButton) { try { tg.BackButton.hide(); tg.BackButton.offClick(closeOrder); } catch (e) {} }
}
function renderOrderBody() {
  const d = OR.dr; if (!d || !$("ctl")) return;
  $("ctl").innerHTML = controlsHTML("dr", d, true);
  $("strip").innerHTML = OR.files.map((f, i) => ((f.k === "p" || f.k === "i")
    ? '<div class="th' + (i === OR.sel ? " sel" : "") + '" data-act="sel" data-i="' + i + '" data-f="' + esc(f.th || f.f) + '"' + (f.th ? ' data-f2="' + esc(f.f) + '"' : "") + "></div>"
    : '<div class="th' + (i === OR.sel ? " sel" : "") + '" data-act="sel" data-i="' + i + '">' + IC("file") + "</div>")).join("");
  hydrateAll($("strip")); paintPreview();
  if (ADMIN && $("clog")) $("clog").innerHTML = OR.log.length ? OR.log.map((l) => '<div class="bub">' + esc(l[1]) + "<small>" + fmtTs(l[0]) + "</small></div>").join("") : '<div class="mut">Пока ничего не отправлено</div>';
}
function paintPreview() {
  const d = OR.dr, pp = PAPERS[d.p] || PAPERS.a4, H = Math.min(280, 340 * pp[2] / pp[1]), W = H * pp[1] / pp[2];
  const p = $("paper"); p.style.width = W + "px"; p.style.height = H + "px";
  const f = OR.files[OR.sel], im = $("p-im"), no = $("p-no");
  im.style.position = "absolute"; im.style.backgroundSize = d.s ? "contain" : "cover"; im.style.filter = "brightness(" + (1 + d.b / 160).toFixed(2) + ") contrast(" + (1 - d.b / 700).toFixed(2) + ")";
  $("p-cnt").textContent = OR.files.length ? "Файл " + (OR.sel + 1) + " из " + OR.files.length : "";
  if (!f) { im.style.backgroundImage = ""; no.innerHTML = OR.files.length ? "" : "Превью загружается…"; return; }
  if (f.k === "p" || f.k === "i") {
    no.innerHTML = ""; const my = OR.id + ":" + OR.sel; im.dataset.k = my;
    loadFirst([f.f, f.th]).then((u) => { if (im.dataset.k === my) { if (u) placePh(im, W, H, u, d.s); im.style.backgroundImage = u ? 'url("' + u + '")' : ""; if (!u) no.innerHTML = "Превью недоступно: файл слишком большой для Telegram"; } });   // исходник, а если не отдаётся - маленькое превью
  }
  else { im.style.backgroundImage = ""; no.innerHTML = IC("file") + "<div>" + esc(f.n || "Документ") + "<br>Печатается страницами целиком</div>"; }
}

/* ---------- просмотр фото и журнал клиента ---------- */
const VW = { list: [], i: 0 };
function openViewer(pid, oid, i) {
  const p = DOC && DOC.people[pid], o = p && p.orders.find((x) => x.o === oid); if (!o) return;
  VW.list = o.fs.filter((f) => f.k === "p" || f.k === "i"); VW.i = Math.max(0, VW.list.findIndex((f) => f === o.fs[i]));
  const v = $("viewer"); v.classList.remove("hide"); document.body.style.overflow = "hidden";
  v.innerHTML = '<div class="vbar"><span id="v-c"></span><button class="ib" data-act="closeViewer" aria-label="Закрыть">' + IC("x") + '</button></div><div class="vimg" id="v-img"></div><div class="vnav"><button class="ib" data-act="vprev" aria-label="Назад">' + IC("left") + '</button><button class="ib" data-act="vnext" aria-label="Вперёд">' + IC("chev") + "</button></div>";
  showViewer();
}
function showViewer() {
  if (!VW.list.length) return; VW.i = (VW.i + VW.list.length) % VW.list.length;
  $("v-c").textContent = (VW.i + 1) + " / " + VW.list.length; const img = $("v-img"), f = VW.list[VW.i]; img.style.backgroundImage = ""; const my = VW.i;
  loadImg(f.th || f.f).then((u) => { if (VW.i === my && u) img.style.backgroundImage = 'url("' + u + '")'; });
  loadImg(f.f).then((u) => { if (VW.i === my && u) img.style.backgroundImage = 'url("' + u + '")'; });
}
function closeViewer() { $("viewer").classList.add("hide"); $("viewer").innerHTML = ""; document.body.style.overflow = $("order").classList.contains("hide") ? "" : "hidden"; }
function openLog(pid, oid) {
  const p = DOC && DOC.people[pid], o = p && p.orders.find((x) => x.o === oid); if (!o) return;
  const el = $("log"); el.classList.remove("hide"); document.body.style.overflow = "hidden";
  el.innerHTML = '<div class="ov-top"><button class="ib" data-act="closeLog" aria-label="Назад">' + IC("left") + '</button><div class="tt"><b>Что видел клиент</b><span>' + esc(p.name) + " · #" + esc(oid) + '</span></div></div><div class="ov-body">' +
    (o.log.length ? o.log.map((l) => '<div class="bub">' + esc(l[1]) + "<small>" + fmtTs(l[0]) + "</small></div>").join("") : '<div class="mut">Журнал пуст</div>') + "</div>";
}

/* ---------- действия ---------- */
let toastT;
function toast(text) { let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "alert"); document.body.appendChild(t); } t.textContent = text; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 5000); }
function send(obj) {
  if (!tg || typeof tg.sendData !== "function") { toast("Открой приложение кнопкой «Панель принтера» в чате с ботом."); return false; }
  try { tg.sendData(JSON.stringify(obj)); } catch (e) { toast("Не получилось отправить: " + e.message); return false; }
  setTimeout(() => { OR.sending = false; toast("Не отправилось. Закрой приложение и открой его кнопкой «Панель принтера» (не из сообщения)."); }, 3000);
  return true;
}
function confirmThen(msg, fn) { if (tg && tg.showConfirm) tg.showConfirm(msg, (ok) => ok && fn()); else if (confirm(msg)) fn(); }
const target = (t) => (t === "dr" ? OR.dr : DF);
function act(name, d) {
  switch (name) {
    case "tab": showTab(d.k); break;
    case "open": openOrder(d.o); break;
    case "closeOrder": closeOrder(); break;
    case "sel": OR.sel = +d.i; $("strip").querySelectorAll(".th").forEach((e, i) => e.classList.toggle("sel", i === OR.sel)); paintPreview(); break;
    case "set": { const o = target(d.t); if (!o) break; const v = d.v; if (d.k === "s") o.s = v === "1"; else o[d.k] = v; if (d.t === "dr") renderOrderBody(); else renderSettings(); break; }
    case "bright": { const o = target(d.t); if (o) { o.b = +d.value; const out = $("bv-" + d.t); if (out) out.textContent = o.b + "%"; if (d.t === "dr") paintPreview(); } break; }
    case "copies": if (OR.dr) { OR.dr.c = Math.max(1, Math.min(99, OR.dr.c + +d.d)); renderOrderBody(); } break;
    case "print": if (OR.id && !OR.sending) { OR.sending = true; const x = OR.dr; if (!send({ a: "print", o: OR.id, q: x.q, s: x.s, c: x.c, b: x.b, p: x.p, m: x.m })) OR.sending = false; } break;
    case "reject": if (OR.id) confirmThen("Отклонить заказ? Клиент получит уведомление.", () => send({ a: "reject", o: OR.id })); break;
    case "stop": confirmThen("Остановить печать? Задание будет удалено из очереди принтера.", () => send({ a: "stop" })); break;
    case "person": if (openP.has(d.p)) openP.delete(d.p); else openP.add(d.p); renderHistory(); break;
    case "view": openViewer(d.p, d.o, +d.i); break;
    case "closeViewer": closeViewer(); break;
    case "vprev": VW.i--; showViewer(); break;
    case "vnext": VW.i++; showViewer(); break;
    case "clog": openLog(d.p, d.o); break;
    case "closeLog": $("log").classList.add("hide"); $("log").innerHTML = ""; document.body.style.overflow = $("order").classList.contains("hide") ? "" : "hidden"; break;
    case "savedef": send({ a: "defaults", q: DF.q, s: DF.s, b: DF.b, p: DF.p, m: DF.m }); break;
    case "coAdd": { const v = +(($("co-id") && $("co-id").value) || "").trim(); if (v > 0) send({ a: "coadmin", op: "add", id: v }); else toast("Введи Telegram ID: число из цифр"); break; }
    case "coDel": confirmThen("Убрать соадмина?", () => send({ a: "coadmin", op: "del", id: +d.id })); break;
    case "asClient": confirmThen("Включить режим клиента? Бот будет выглядеть как для обычного человека. Выйти: /asadmin.", () => send({ a: "asclient" })); break;
  }
}
document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-act]"); if (t && t.tagName !== "INPUT") { act(t.dataset.act, t.dataset); } });
document.addEventListener("input", (e) => { const t = e.target; if (t && t.dataset && t.dataset.act === "bright") act("bright", { t: t.dataset.t, value: t.value }); });

/* ---------- запуск ---------- */
window.__app = { calcProg, pageFids, hydrateAll, act, historyHTML, controlsHTML, get S() { return S; }, set S(v) { S = v; }, get DOC() { return DOC; }, set DOC(v) { DOC = v; }, renderAll, tick, openOrder, OR, mono };
showTab("printer"); renderConn(); renderQueue();
if (VIEWER && TK) { poll(); setInterval(poll, 2000); } else { tick(); }
setInterval(() => { if (S) tick(); }, 500);
</script>
</body>
