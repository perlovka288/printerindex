<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Панель принтера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0a0a;--s1:#111;--s2:#191919;--s3:#242424;--line:#3b3b3b;--line2:#8a8a8a;
  --tx:#f2f2f2;--mut:#9d9d9d;--dim:#5e5e5e;
  --ok:#8dffb0;--bad:#ff7070;--warn:#ffd36b;
  --rail:22px;
  --notch:polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px));
  --font:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace;
  --pfont:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace;--card:rgba(14,14,14,.93);--bar:rgba(10,10,10,.96);--pure:#000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;touch-action:pan-y;overscroll-behavior-x:none;margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 var(--font);-webkit-font-smoothing:none;font-smooth:never;overflow-x:hidden}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px dashed #fff;outline-offset:2px}
.hide{display:none!important}
.ic{display:inline-block;fill:currentColor;flex:none;shape-rendering:crispEdges;vertical-align:middle}
.px{border:2px solid var(--bc,var(--line));clip-path:var(--notch)}

body.light{--bg:#fff;--s1:#f5f5f5;--s2:#ececec;--s3:#e0e0e0;--line:#c9c9c9;--line2:#555;--tx:#000;--mut:#555;--dim:#999;--ok:#0a8a3a;--bad:#c62828;--warn:#9a6b00;--card:rgba(255,255,255,.94);--bar:rgba(255,255,255,.97);--pure:#fff}
body.light #px{filter:grayscale(1) contrast(1000) invert(1)}
body.light .printer>svg{filter:invert(1)}
body.light .paper{box-shadow:4px 4px 0 #bbb,0 0 0 2px #000}
/* пиксельный фон: фото, которое печатается, вырисовывается точками по бокам */
.right{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#px,#pxc{contain:strict;transform:translateZ(0)}
#px{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;filter:grayscale(1) contrast(1000);opacity:.4;transition:opacity .6s steps(6);pointer-events:none}
body.printing #px{opacity:1}
#pxc{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;filter:grayscale(1) contrast(1000);opacity:.55;transition:opacity .6s steps(6)}
body.printing #pxc{opacity:1}body.light #pxc{filter:grayscale(1) contrast(1000) invert(1)}
.pxc-wrap{display:none;position:relative;height:min(62vw,270px);margin:12px 0 4px;border:2px solid var(--line2);background:var(--pure);overflow:hidden}
.top,main,.tabs{position:relative;z-index:2}

/* каркас */
.top{position:sticky;top:0;z-index:5;margin:0 var(--rail);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--bar);border-bottom:2px solid var(--line)}
.ttl{font:400 12px/1.2 var(--pfont);letter-spacing:.02em;text-transform:uppercase}
.conn{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.conn i{width:8px;height:8px;background:var(--dim)}
.conn.on i{background:var(--ok);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
main{padding:14px var(--rail) calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:var(--rail);right:var(--rail);bottom:0;z-index:6;display:flex;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);border-top:2px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:12px;color:var(--mut)}
.tabs button.on{color:var(--bg);background:var(--tx)}
.tabs button .ic{width:24px;height:24px}

.card{--bc:var(--line);background:var(--card);padding:16px;margin:0 0 14px;border:2px solid var(--bc);clip-path:var(--notch)}
.lab{font:400 10px/1.4 var(--pfont);letter-spacing:.02em;text-transform:uppercase;color:var(--mut)}
.sec{margin:20px 2px 10px}
.mut{color:var(--mut);font-size:14px}
.btn{--bc:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;background:var(--tx);color:var(--bg);font-weight:600;border:2px solid var(--bc);clip-path:var(--notch);box-shadow:inset -3px -3px 0 rgba(0,0,0,.28);transition:transform .08s steps(2)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.sec2{--bc:var(--line2);background:var(--s3);color:var(--tx)}
.btn.danger{--bc:var(--bad);background:var(--s2);color:var(--bad)}
.btn[disabled]{opacity:.4}
.link{display:inline-flex;align-items:center;gap:7px;padding:8px 0;color:var(--mut);font-size:14px;text-decoration:underline;text-decoration-style:dotted}
.chip{display:inline-block;padding:2px 8px;border:2px solid var(--line);font-size:13px;color:var(--mut);white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.stop{border-color:var(--warn);color:var(--warn)}.chip.err{border-color:var(--bad);color:var(--bad)}

/* принтер */
.pc{padding:16px 14px 16px}
.pc-head{display:flex;align-items:center;gap:8px}
.led{width:8px;height:8px;background:var(--dim)}
.pc[data-led=busy] .led{background:var(--tx);animation:blink .6s steps(2) infinite}
.pc[data-led=ok] .led{background:var(--ok)}.pc[data-led=err] .led{background:var(--bad)}
.pc-title{font:400 13px/1.4 var(--pfont);margin:10px 0 0}
.printer{position:relative;width:236px;height:268px;margin:12px auto 0}
.printer svg{display:block;position:absolute;shape-rendering:crispEdges}
.p-tray{left:53px;top:0;width:130px;height:35px;z-index:1}
.p-body{left:0;top:14px;width:236px;height:100px;z-index:3}
.p-outtray{left:23px;top:112px;width:190px;height:40px;z-index:1}
@keyframes vib{50%{transform:translateY(2px)}}
.led-dot{fill:#555}.led-glow{fill:transparent}
.pc[data-on="1"] .led-dot{fill:#6fd39a}
.pc[data-led=busy] .led-dot{fill:#fff;animation:blink .5s steps(2) infinite}.pc[data-led=busy] .led-glow{fill:rgba(255,255,255,.35)}
.pc[data-led=ok] .led-dot{fill:var(--ok)}.pc[data-led=ok] .led-glow{fill:rgba(141,255,176,.4)}
.pc[data-led=err] .led-dot{fill:var(--bad);animation:blink .4s steps(2) infinite}.pc[data-led=err] .led-glow{fill:rgba(255,112,112,.4)}
.p-out{position:absolute;left:50%;top:108px;width:150px;height:158px;margin-left:-75px;overflow:hidden;z-index:2}
.sheet{position:absolute;left:50%;top:0;width:106px;height:150px;margin-left:-53px;background:#ecece8;border:2px solid #fff;overflow:hidden;
  --r:0;transform:translateY(calc((var(--r) - 1) * 100%));transition:transform 1s linear,opacity .25s steps(3);opacity:0}
.sheet.show{opacity:1}.sheet.reset{transition:none}
.sheet.fall{transition:transform .28s steps(5),opacity .28s steps(3);transform:translateY(26px);opacity:0}
.sheet .sin{position:absolute;inset:0}
.sheet .ph-ic{position:absolute;inset:0;display:none;place-items:center;color:#777}.sheet.empty .ph-ic{display:grid}
.sheet .ph-ic .ic{width:30px;height:24px}
.pg .cell{position:absolute;overflow:hidden}
.pg .cell.blank{outline:1px dashed rgba(0,0,0,.18);outline-offset:-1px}
.pg .ci{position:absolute;inset:0;background:#bdbdb9 center no-repeat;opacity:0;transition:opacity .3s steps(4)}
.pg .ci.ld{opacity:1}.pg .ci.fit{background-size:contain;background-color:transparent}.pg .ci.fill{background-size:cover}
.pg .mgn{position:absolute;background:repeating-linear-gradient(45deg,#fff 0 3px,#d2d2d2 3px 4px)}
.okb{position:absolute;left:50%;top:150px;width:60px;height:60px;margin-left:-30px;background:var(--ok);color:#06150d;display:grid;place-items:center;z-index:5;transform:scale(0);transition:transform .35s steps(5);clip-path:var(--notch)}
.okb .ic{width:32px;height:30px}
.pc[data-led=ok] .okb{transform:scale(1)}
.cnt{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:6px;font-variant-numeric:tabular-nums;font-family:var(--pfont)}
.cnt b{font-size:24px;font-weight:400}.cnt span{font-size:14px;color:var(--mut)}.cnt .pct{margin-left:8px;font-size:11px}
.bar{height:16px;border:2px solid var(--line2);margin:12px 2px 10px;padding:2px;background:var(--pure)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--tx) 0 8px,transparent 8px 10px);transition:width .9s steps(12)}
.pc[data-led=ok] .bar i{background:repeating-linear-gradient(90deg,var(--ok) 0 8px,transparent 8px 10px)}
.pc-sub{text-align:center;color:var(--mut);font-size:14px;min-height:19px}
.bgrp{display:flex;width:100%;border:2px solid var(--line2);background:var(--s2)}
.bgrp>button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 4px;font-size:14px;color:var(--tx)}
.bgrp>button+button{border-left:2px solid var(--line2)}
.bgrp>button .ic{width:20px;height:20px}
@media (hover:hover){.bgrp>button:not([disabled]):hover{background:var(--s3)}}
.bgrp>button:not([disabled]):active{background:var(--tx);color:var(--bg)}
.bgrp>button[disabled]{opacity:.35;cursor:default}
.bgrp>button.danger:not([disabled]){color:var(--bad)}
.bgrp .bdg{min-width:18px;height:18px;padding:0 4px;background:var(--tx);color:var(--bg);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
#qa{margin-top:14px}

/* списки */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:10px;background:var(--card);border:2px solid var(--line);clip-path:var(--notch)}
.row:active{background:var(--s3)}
.row .rt{flex:1;min-width:0}.row .rt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .rt span{color:var(--mut);font-size:14px}
.row>.ic{color:var(--dim)}
.th{position:relative;width:52px;height:52px;background:var(--s3) center/cover no-repeat;flex:none;overflow:hidden;border:2px solid var(--line);image-rendering:auto}
.th.more{display:grid;place-items:center;color:var(--mut);font-size:14px;font-weight:600}.th.er{opacity:.5}.th .ic{position:absolute;inset:0;margin:auto;color:var(--dim)}
.empty{display:grid;place-items:center;gap:8px;padding:34px 10px;color:var(--mut);text-align:center}
.empty .ic{width:36px;height:36px;color:var(--dim)}
.av{width:42px;height:42px;background:var(--s3);display:grid;place-items:center;font:400 14px var(--pfont);flex:none;border:2px solid var(--line2)}
.person{margin-bottom:10px;background:var(--card);border:2px solid var(--line);clip-path:var(--notch)}
.person>.row{margin:0;border:0;clip-path:none;background:none}
.person .chev{transition:transform .2s steps(3)}.person.open .chev{transform:rotate(180deg)}
.pbody{display:none;padding:2px 12px 12px;border-top:2px solid var(--line)}.person.open .pbody{display:block}
.ob{padding:12px 0 4px;border-bottom:2px dotted var(--line)}.ob:last-child{border-bottom:0}
.oh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}.od{font-weight:600;font-size:15px}
.meta{color:var(--mut);font-size:13.5px;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid .th{width:auto;height:auto;aspect-ratio:1}

/* настройки и окно печати (повторяет окно Windows «Выберите способ печати изображений») */
.grp{padding:14px 0;border-bottom:2px dotted var(--line)}.grp:last-child{border-bottom:0}
.grp h3{margin:0 0 9px;font-size:14px;font-weight:600;color:var(--mut)}
.dlgt{font:400 11px/1.5 var(--pfont);margin:2px 0 12px;color:var(--tx)}
.ddg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.dd{display:block;width:100%}
.dd small{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.dd .v{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:40px;padding:0 8px 0 10px;background:var(--s2);border:2px solid var(--line2);font-size:14.5px}
.dd .v span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .v .ic{width:14px;height:8px;color:var(--mut)}
.dd[disabled] .v{opacity:.6}
@media (hover:hover){.dd:not([disabled]):hover .v{background:var(--s3)}}
.dd:not([disabled]):active .v{background:var(--tx);color:var(--bg)}
.dmain{display:grid;grid-template-columns:minmax(0,1fr) 98px;gap:10px;margin-top:12px}
.pv{position:relative;display:grid;place-items:center;min-height:300px;background:var(--pure);border:2px solid var(--line);padding:8px}
.paper{position:relative;background:#f4f4f1;overflow:hidden;transition:width .2s steps(3),height .2s steps(3);box-shadow:4px 4px 0 #000,0 0 0 2px #fff}
.paper .nofile{position:absolute;inset:0;display:grid;place-items:center;color:#7a7a76;text-align:center;font-size:13px;padding:10px;z-index:3}
.rail{height:300px;overflow-y:auto;background:var(--s1);border:2px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.rail.h{height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden}
.rail.h .lt{width:98px;flex:none}
.lt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px 5px;border:2px solid transparent;font-size:12.5px;text-align:center;color:var(--mut);line-height:1.15}
.lt svg{width:68px;height:52px;shape-rendering:crispEdges}
.lt.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
@media (hover:hover){.lt:not(.on):hover{border-color:var(--line2);color:var(--tx)}}
.pnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 4px}
.pnav .ib2{width:38px;height:34px;display:grid;place-items:center;background:var(--s2);border:2px solid var(--line2)}
.pnav .ib2:active{background:var(--tx);color:var(--bg)}.pnav .ib2[disabled]{opacity:.3}
.pnav .ib2 .ic{width:14px;height:20px}
.pnav .pn{min-width:110px;text-align:center;color:var(--mut);font-size:14.5px}
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px;padding:12px;background:var(--card);border:2px solid var(--line)}
.bar2 .cp{display:flex;align-items:center;gap:8px;font-size:14.5px}
.ck{display:flex;align-items:center;gap:9px;font-size:14.5px;text-align:left}
.ck i{width:20px;height:20px;border:2px solid var(--line2);background:var(--pure);display:grid;place-items:center;flex:none}
.ck i .ic{width:14px;height:12px;color:var(--bg);display:none}
.ck.on i{background:var(--tx)}.ck.on i .ic{display:block}
.rng{display:flex;align-items:center;gap:12px}.rng input{flex:1;accent-color:#fff}.rng output{min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.stp{display:inline-flex;align-items:center;background:var(--s2);border:2px solid var(--line2)}
.stp button{width:40px;height:36px;display:grid;place-items:center}.stp button[disabled]{opacity:.3}
.stp button .ic{width:16px;height:16px}
.stp output{min-width:38px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stp button:not([disabled]):active{background:var(--tx);color:var(--bg)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.inp{width:100%;min-height:46px;padding:0 14px;background:var(--s2);border:2px solid var(--line2);color:var(--tx);font:inherit;border-radius:0}

/* окна */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ov-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:var(--bg);border-bottom:2px solid var(--line)}
.ov-top .ib{width:42px;height:42px;display:grid;place-items:center;background:var(--s2);border:2px solid var(--line2)}
.ov-top .ib .ic{width:14px;height:20px}
.ov-top .tt{flex:1;min-width:0}.ov-top .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ov-top .tt span{color:var(--mut);font-size:13.5px}
.ov-body{padding:12px 14px calc(120px + env(safe-area-inset-bottom,0px))}
.strip{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip .th{width:50px;height:50px;opacity:.5}.strip .th.sel{opacity:1;border-color:var(--tx)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.actions .btn{flex:1}.actions .btn.danger{flex:0 0 auto;width:auto;padding:0 18px}
.bub{max-width:88%;margin:0 0 8px;padding:9px 12px;background:var(--s2);border:2px solid var(--line)}
.bub small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
#viewer{background:#000;display:flex;flex-direction:column}
#viewer .vimg{flex:1;background:center/contain no-repeat;margin:0}
#viewer .vbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;color:#fff}
#viewer .vnav{display:flex;justify-content:space-between;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#viewer .ib{width:46px;height:46px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:2px solid #fff}
#viewer .ib .ic{width:14px;height:20px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;padding:12px 14px;background:var(--s3);border:2px solid var(--line2)}
/* выбор из списка (как выпадающий список Windows) */
.pk{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end}
.pk-bg{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.pk-box{position:relative;width:100%;max-height:78vh;overflow-y:auto;background:var(--bg);border-top:2px solid var(--tx);padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.pk-t{font:400 11px/1.4 var(--pfont);margin:0 0 12px}
.po{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 12px;margin-bottom:6px;background:var(--s2);border:2px solid var(--line);font-size:15px}
.po small{display:block;color:var(--mut);font-size:12.5px}
.po.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.po.on small{color:#444}
.po .ic{width:16px;height:14px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.enter{animation:rise .24s steps(4) both}
/* телефон: вместо картинки принтера в карточке пиксель-арт того, что печатается; настройки в одну колонку */
@media (max-width:699px){
  :root{--rail:0px}
  .right{display:none}
  .printer{display:none}.pxc-wrap{display:block}
  .top{margin:0;padding:10px 52px 10px 14px}
  .top .th2{top:calc(7px + env(safe-area-inset-top,0px))}
  main{padding:14px 12px calc(84px + env(safe-area-inset-bottom,0px))}
  .card{padding:14px 12px}
  .tabs{left:0;right:0;gap:16px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));overflow-x:auto}
  .tabs button{font-size:15px;white-space:nowrap}
  .ov-top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .dmain{grid-template-columns:minmax(0,1fr)}
  .dmain .rail{height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .dmain .rail .lt{width:92px;flex:none}
  .pv{min-height:240px}
  .lt svg{width:64px;height:48px}
  .dd .v{min-height:44px}.stp button{width:44px;height:42px}.ck i{width:24px;height:24px}.pnav .ib2{width:44px;height:40px}
  .bar2{flex-direction:column;align-items:stretch;gap:12px}
  .actions .btn{min-height:52px}
}
@media (min-width:700px){
  :root{--rail:0px}
  .right{left:50%}

const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, f) => n + " " + (n % 10 === 1 && n % 100 !== 11 ? f[0] : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? f[1] : f[2]);

/* ---------- геометрия листа: ТОЧНАЯ копия расчёта из layouts.py и smartfit.py (мм) ----------
   Превью в приложении и печать считают рамки одинаково, поэтому на экране видно то, что напечатается.
   Если меняешь числа, меняй их и в layouts.py (проверка: python tools_check.py). */
/*GEOM-BEGIN*/
const GAP = 2, MIN_M = 4, CONTACT_M = 10;
const LAYOUTS = {
  full:    { name: "Во всю страницу",    n: 1,  cell: null,        cols: 1, rows: 1, orient: "A" },
  "13x18": { name: "13 × 18 см (2)",     n: 2,  cell: [130, 180],  cols: 2, rows: 1, orient: "L" },
  "20x25": { name: "20 × 25 см (1)",     n: 1,  cell: [200, 250],  cols: 1, rows: 1, orient: "A" },
  "10x15": { name: "10 × 15 см (2)",     n: 2,  cell: [100, 150],  cols: 2, rows: 1, orient: "L" },
  "9x13":  { name: "9 × 13 см (4)",      n: 4,  cell: [130, 90],   cols: 2, rows: 2, orient: "L" },
  wallet:  { name: "Кошелёк (9)",        n: 9,  cell: [89, 63.5],  cols: 3, rows: 3, orient: "L" },
  contact: { name: "Обзорный лист (35)", n: 35, cell: null,        cols: 5, rows: 7, orient: "P" },
};
/* сетки: pw x ph - бумага (книжная), firstLand - первое фото листа альбомное */
function gridPlan(layout, pw, ph, firstLand) {
  const sp = LAYOUTS[layout], land = sp.orient === "L" || (sp.orient === "A" && !!firstLand);
  const W = land ? ph : pw, H = land ? pw : ph; let cw, ch;
  if (layout === "contact") { cw = (W - 2 * CONTACT_M - GAP * (sp.cols - 1)) / sp.cols; ch = (H - 2 * CONTACT_M - GAP * (sp.rows - 1)) / sp.rows; }
  else { cw = sp.cell[0]; ch = sp.cell[1]; if (sp.orient === "A" && land) { const t = cw; cw = ch; ch = t; } }
  let gw = sp.cols * cw + (sp.cols - 1) * GAP, gh = sp.rows * ch + (sp.rows - 1) * GAP;
  const k = Math.min(1, (W - 2 * MIN_M) / gw, (H - 2 * MIN_M) / gh);
  cw *= k; ch *= k; const gap = GAP * k;
  gw = sp.cols * cw + (sp.cols - 1) * gap; gh = sp.rows * ch + (sp.rows - 1) * gap;
  const x0 = (W - gw) / 2, y0 = (H - gh) / 2, cells = [];
  for (let r = 0; r < sp.rows; r++) for (let c = 0; c < sp.cols; c++) cells.push({ x: x0 + c * (cw + gap), y: y0 + r * (ch + gap), w: cw, h: ch });
  return { land, W, H, cells, mg: null };
}
/* «Во всю страницу»: mg = аппаратные поля принтера [слева, справа, сверху, снизу] в мм.
   smart: фото целиком в области печати. Иначе (по размеру кадра) фото заполняет ВЕСЬ лист, лишнее обрезается. */
function fullPlan(iw, ih, pw, ph, mg, smart, mm) {
  mm = mm || 0; const m = mg && mg.length === 4 ? mg : [3, 3, 3, 3], ml = m[0], mr = m[1], mt = m[2], mb = m[3];
  const prW = pw - ml - mr, prH = ph - mt - mb; let left, top, right, bottom;
  if (smart) {
    left = Math.max(0, mm - ml); top = Math.max(0, mm - mt); right = Math.min(prW, pw - mm - ml); bottom = Math.min(prH, ph - mm - mt);
    if (right - left < 1 || bottom - top < 1) { left = 0; top = 0; right = prW; bottom = prH; }
  } else { left = -ml; top = -mt; right = pw - ml; bottom = ph - mt; }
  const rw = right - left, rh = bottom - top;
  const sp = smart ? Math.min(rw / iw, rh / ih) : Math.max(rw / iw, rh / ih);
  const sr = smart ? Math.min(rw / ih, rh / iw) : Math.max(rw / ih, rh / iw);
  const rotate = smart ? sr > sp * 1.001 : sr < sp * 0.999;
  const x0 = left + ml, y0 = top + mt, x1 = right + ml, y1 = bottom + mt;   // область на листе (книжном), от его угла
  let cell, W, H, ov = null;
  if (rotate) {   // альбомная страница: лист поворачивается на 90° против часовой, поля поворачиваются вместе с ним
    W = ph; H = pw; cell = { x: ph - y1, y: x0, w: y1 - y0, h: x1 - x0 };
    ov = { t: ml, b: mr, r: mt, l: mb };
  } else { W = pw; H = ph; cell = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }; ov = { t: mt, b: mb, l: ml, r: mr }; }
  return { land: rotate, W, H, cells: [cell], mg: smart ? null : ov };
}
/*GEOM-END*/
function planFor(layout, paperKey, dims, smart) {
  const pp = PAPERS[paperKey] || PAPERS.a4, iw = dims ? dims[0] : 3, ih = dims ? dims[1] : 4;
  if (!LAYOUTS[layout] || layout === "full") return fullPlan(iw, ih, pp[1], pp[2], S && S.mg, smart, 0);
  return gridPlan(layout, pp[1], pp[2], iw > ih);
}
/* листы заказа: копии каждого фото подряд (A, A, B, B), потом раскладка режет их на листы. Документы идут отдельными листами. */
function planSheets(fs, copies, layout) {
  const out = []; let buf = []; const n = (LAYOUTS[layout] || LAYOUTS.full).n;
  const flush = () => { for (let i = 0; i < buf.length; i += n) out.push({ idx: buf.slice(i, i + n) }); buf = []; };
  fs.forEach((f, i) => { if (f.k === "p" || f.k === "i") { for (let c = 0; c < copies; c++) buf.push(i); } else { flush(); for (let c = 0; c < copies; c++) out.push({ idx: [i], doc: true }); } });
  flush(); return out;
}
/* рисует лист: рамки с фото. items - для каждого кадра массив file_id (пробуем по очереди). o.physical: показать лист так, как он выйдет из принтера (повёрнутым) */
function paintSheet(host, L, items, o) {
  host.innerHTML = "";
  const page = document.createElement("div"); page.className = "pg";
  if (o.physical && L.land) page.style.cssText = "position:absolute;left:50%;top:50%;width:" + o.hostH + "px;height:" + o.hostW + "px;transform:translate(-50%,-50%) rotate(-90deg)";
  else page.style.cssText = "position:absolute;inset:0";
  const bf = o.bright ? "brightness(" + (1 + o.bright / 160).toFixed(2) + ") contrast(" + (1 - o.bright / 700).toFixed(2) + ")" : "";
  L.cells.forEach((c, i) => {
    const it = items[i], d = document.createElement("div"); d.className = "cell" + (it ? "" : (o.guides ? " blank" : ""));
    d.style.cssText = "left:" + (c.x / L.W * 100) + "%;top:" + (c.y / L.H * 100) + "%;width:" + (c.w / L.W * 100) + "%;height:" + (c.h / L.H * 100) + "%";
    if (it) { const im = document.createElement("div"); im.className = "ci " + (o.smart ? "fit" : "fill"); im.dataset.f = it[0] || ""; if (it[1]) im.dataset.f2 = it[1]; if (bf) im.style.filter = bf; d.appendChild(im); }
    page.appendChild(d);
  });
  if (L.mg && o.margins !== false) {   // белая кайма: драйвер не печатает в аппаратных полях принтера
    const mk = (css) => { const e = document.createElement("div"); e.className = "mgn"; e.style.cssText = css; page.appendChild(e); };
    const m = L.mg;
    if (m.t > 0.4) mk("left:0;top:0;width:100%;height:" + m.t / L.H * 100 + "%");
    if (m.b > 0.4) mk("left:0;bottom:0;width:100%;height:" + m.b / L.H * 100 + "%");
    if (m.l > 0.4) mk("left:0;top:0;height:100%;width:" + m.l / L.W * 100 + "%");
    if (m.r > 0.4) mk("right:0;top:0;height:100%;width:" + m.r / L.W * 100 + "%");
  }

}
/* значок раскладки для списка справа (как в Windows): страница и рамки */
function layoutIcon(key) {
  const L = key === "full" ? fullPlan(4, 3, 210, 297, [0, 0, 0, 0], true, 4) : gridPlan(key, 210, 297, true);
  const bw = 34, bh = 26, k = Math.min(bw / L.W, bh / L.H), pw = Math.round(L.W * k), ph = Math.round(L.H * k), ox = Math.round((36 - pw) / 2), oy = Math.round((28 - ph) / 2);
  let s = '<svg viewBox="0 0 36 28" aria-hidden="true"><rect x="' + ox + '" y="' + oy + '" width="' + pw + '" height="' + ph + '" fill="#e9e9e5"/>';
  L.cells.forEach((c) => {
    const x = ox + Math.round(c.x * k), y = oy + Math.round(c.y * k), w = Math.max(2, Math.round(c.w * k)), h = Math.max(2, Math.round(c.h * k));
    s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="#6d6d6d"/><rect x="' + x + '" y="' + (y + Math.round(h * .55)) + '" width="' + w + '" height="' + Math.max(1, h - Math.round(h * .55)) + '" fill="#2f2f2f"/>';
  });
  return s + "</svg>";
}

/* ---------- прогресс: чистая функция, один в один с логикой бота ---------- */
/* n - состояние печати из бота; recvAt - когда оно получено; el у бота = секунд с начала печати на момент публикации */
const mono = { o: "", v: 0 };
function calcProg(n, recvAt, nowMs) {
  const P = n.P || 0, d = Math.min(P, n.d || 0);
  const out = { st: n.st, P, d, pages: d, pr: 0, k: d, cur: P ? Math.min(P - 1, d) : 0, fr: 0 };
  /* d - РЕАЛЬНО напечатанные страницы: их задания ушли из очереди принтера (так считает бот).
     Внутри текущей страницы шкала ползёт по времени, но до следующей страницы сама не дотягивает. */
  if (n.st === "done") { out.pages = P; out.k = P; out.cur = Math.max(0, P - 1); out.fr = 1; }
  else if (n.st === "print" && P > 0) {
    if (d >= P) { out.pages = P - 0.01; out.cur = P - 1; out.fr = 1; }   // все страницы вышли, принтер заканчивает
    else {
      const el = (n.el || 0) + Math.max(0, nowMs - recvAt) / 1000;
      out.fr = Math.min(0.97, el / Math.max(0.01, n.spp || 40)); out.pages = d + out.fr;
    }
  } else if (n.st === "stop" || n.st === "err") { out.pages = d; }
  if (n.st === "print") {   // шкала только растёт
    if (mono.o !== n.o) { mono.o = n.o; mono.v = 0; }
    if (out.pages < mono.v) { out.pages = Math.min(mono.v, d + 0.97); out.fr = out.pages - d; }
    mono.v = out.pages;
  }
  out.pr = P ? Math.min(1, out.pages / P) : 0;
  return out;
}

/* ---------- данные: состояние (закреплённое сообщение) и файл истории ---------- */
let S = null, DOC = null, docVer = -1, recvAt = 0, online = false, loadingDoc = false;
async function api(method, params) { const r = await fetch(API + "/" + method + "?" + new URLSearchParams(params || {})); return r.json(); }
const pathCache = new Map(), urlCache = new Map(), dimCache = new Map(), dead = new Set();
async function fileUrl(fid) {
  if (!fid || !TK) return "";
  if (pathCache.has(fid)) return pathCache.get(fid);
  if (dead.has(fid)) return "";
  for (let a = 0; a < 5; a++) {
    try {
      const r = await api("getFile", { file_id: fid });
      if (r.ok) { const u = "https://api.telegram.org/file/bot" + TK + "/" + r.result.file_path; pathCache.set(fid, u); return u; }
      if (r.error_code === 429) { const ra = r.parameters && typeof r.parameters.retry_after === "number" ? r.parameters.retry_after : 2; await sleep(ra * 1000 + 200); continue; }   // лимит запросов: ждём сколько просит Telegram, а не сдаёмся
      if (r.error_code === 400 || r.error_code === 401) { dead.add(fid); break; }   // файл слишком большой / не найден: повторять бесполезно
    } catch (e) {}
    await sleep(500 * (a + 1));
  }

function toast(text) { let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "alert"); document.body.appendChild(t); } t.textContent = text; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 5000); }
function send(obj) {
  if (!tg || typeof tg.sendData !== "function") { toast("Открой приложение кнопкой «Панель принтера» в чате с ботом."); return false; }
  try { tg.sendData(JSON.stringify(obj)); } catch (e) { toast("Не получилось отправить: " + e.message); return false; }
  setTimeout(() => { OR.sending = false; toast("Не отправилось. Закрой приложение и открой его кнопкой «Панель принтера» (не из сообщения)."); }, 3000);
  return true;
}
function confirmThen(msg, fn) { if (tg && tg.showConfirm) tg.showConfirm(msg, (ok) => ok && fn()); else if (confirm(msg)) fn(); }

/* ---------- действия ---------- */
function act(name, d) {
  switch (name) {
    case "tab": showTab(d.k); break;
    case "goqueue": showTab("printer"); { const l = $("q-lab"); if (l && l.scrollIntoView) l.scrollIntoView({ behavior: "smooth", block: "start" }); } break;
    case "open": openOrder(d.o); break;
    case "closeOrder": closeOrder(); break;
    case "sel": { OR.sel = +d.i; const k = OR.sheets.findIndex((s) => s.idx.includes(OR.sel)); if (k >= 0) OR.pg = k; $("strip").querySelectorAll(".th").forEach((e, i) => e.classList.toggle("sel", i === OR.sel)); paintPreview(); break; }
    case "pgprev": OR.pg = Math.max(0, OR.pg - 1); paintPreview(); break;
    case "pgnext": OR.pg = Math.min(Math.max(0, OR.sheets.length - 1), OR.pg + 1); paintPreview(); break;
    case "layout": { const o = target(d.t); if (o && LAYOUTS[d.l]) { o.l = d.l; OR.pg = 0; changed(d.t); } break; }
    case "fit": { const o = target(d.t); if (o) { o.s = !o.s; changed(d.t); } break; }
    case "pick": openPicker(d.t, d.k); break;
    case "pickmore": PK.more = true; renderPicker(); break;
    case "pickset": { const o = target(PK.t); if (o) { o[{ paper: "p", quality: "q", media: "m" }[PK.kind]] = d.v; OR.pg = 0; closePicker(); changed(PK.t); } break; }
    case "pkclose": closePicker(); break;
    case "params": openParams(d.t); break;
    case "savedef2": if (OR.dr) { const x = OR.dr; send({ a: "defaults", q: x.q, s: x.s, b: x.b, p: x.p, m: x.m, l: x.l }); } break;
    case "bright": { const o = target(d.t); if (o) { o.b = +d.value; const out = $("bv-" + d.t); if (out) out.textContent = o.b + "%"; if (d.t === "dr") paintPreview(); } break; }
    case "copies": if (OR.dr) { OR.dr.c = Math.max(1, Math.min(99, OR.dr.c + +d.d)); OR.pg = 0; renderOrderBody(); } break;
    case "print": if (OR.id && !OR.sending) { OR.sending = true; const x = OR.dr; if (!send({ a: "print", o: OR.id, q: x.q, s: x.s, c: x.c, b: x.b, p: x.p, m: x.m, l: x.l })) OR.sending = false; } break;
    case "reject": if (OR.id) confirmThen("Отклонить заказ? Клиент получит уведомление.", () => send({ a: "reject", o: OR.id })); break;
    case "stop": confirmThen("Остановить печать? Задание будет удалено из очереди принтера.", () => send({ a: "stop" })); break;
    case "person": if (openP.has(d.p)) openP.delete(d.p); else openP.add(d.p); renderHistory(); break;
    case "view": openViewer(d.p, d.o, +d.i); break;
    case "closeViewer": closeViewer(); break;
    case "vprev": VW.i--; showViewer(); break;
    case "vnext": VW.i++; showViewer(); break;
    case "clog": openLog(d.p, d.o); break;
    case "reloadDoc": docNext = 0; docFail = ""; renderHistory(); loadDoc(true); break;
    case "closeLog": $("log").classList.add("hide"); $("log").innerHTML = ""; document.body.style.overflow = $("order").classList.contains("hide") ? "" : "hidden"; break;
    case "savedef": send({ a: "defaults", q: DF.q, s: DF.s, b: DF.b, p: DF.p, m: DF.m, l: DF.l }); break;
    case "coAdd": { const v = +(($("co-id") && $("co-id").value) || "").trim(); if (v > 0) send({ a: "coadmin", op: "add", id: v }); else toast("Введи Telegram ID: число из цифр"); break; }
    case "coDel": confirmThen("Убрать соадмина?", () => send({ a: "coadmin", op: "del", id: +d.id })); break;
    case "asClient": confirmThen("Включить режим клиента? Бот будет выглядеть как для обычного человека. Выйти: /asadmin.", () => send({ a: "asclient" })); break;
  }
}
document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-act]"); if (t && t.tagName !== "INPUT" && !t.disabled) { act(t.dataset.act, t.dataset); } });
document.addEventListener("input", (e) => { const t = e.target; if (t && t.dataset && t.dataset.act === "bright") act("bright", { t: t.dataset.t, value: t.value }); });

let dark = true; try { dark = localStorage.getItem("theme") !== "light"; } catch (e) {}
function setTheme(d) {
  dark = d; document.body.classList.toggle("light", !d); $("theme").innerHTML = d ? SUN : MOON;
  try { localStorage.setItem("theme", d ? "dark" : "light"); } catch (e) {}
  try { if (tg) { tg.setHeaderColor && tg.setHeaderColor(d ? "#0a0a0a" : "#ffffff"); tg.setBackgroundColor && tg.setBackgroundColor(d ? "#0a0a0a" : "#ffffff"); } } catch (e) {}
}
